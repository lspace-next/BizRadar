<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&display=swap">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #05080d; font-family: "Pretendard Variable", Pretendard, sans-serif; color: #f1f5f9; }
  .og {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background:
      radial-gradient(520px 380px at 1030px 120px, rgba(20,184,166,.32), transparent 70%),
      radial-gradient(420px 300px at 120px 640px, rgba(37,99,235,.35), transparent 70%),
      radial-gradient(360px 200px at 640px 650px, rgba(16,185,129,.14), transparent 70%),
      #05080d;
  }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .radar { position: absolute; right: -150px; top: 70px; width: 560px; height: 560px; }
  .radar i { position: absolute; border: 1px solid rgba(255,255,255,.09); border-radius: 50%; }
  .eyebrow { position: absolute; left: 80px; top: 74px; display: flex; align-items: center; gap: 14px; font-family: "JetBrains Mono", monospace; font-size: 25px; font-weight: 500; letter-spacing: .14em; color: #7dd3c0; }
  .eyebrow b { width: 14px; height: 14px; border-radius: 50%; background: #34d399; box-shadow: 0 0 0 6px rgba(52,211,153,.18); }
  h1 { position: absolute; left: 80px; top: 128px; margin: 0; font-size: 92px; font-weight: 800; line-height: 1.18; letter-spacing: -0.035em; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #38bdf8, #2dd4bf 45%, #4ade80); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { position: absolute; left: 82px; top: 372px; font-size: 26px; font-weight: 500; color: #94a3b8; letter-spacing: -0.01em; }

  /* 축소 카드: 실제 목록의 판정 줄 */
  .card {
    position: absolute; right: 70px; top: 196px; width: 360px; padding: 22px 24px;
    border-radius: 18px; background: rgba(15,23,32,.82); border: 1px solid rgba(255,255,255,.09);
    box-shadow: 0 30px 60px rgba(0,0,0,.45); backdrop-filter: blur(6px);
  }
  .card .top { display: flex; justify-content: space-between; align-items: baseline; }
  .card .type { font-size: 16px; font-weight: 700; color: #a78bfa; }
  .card .dday { font-family: "JetBrains Mono", monospace; font-size: 30px; font-weight: 600; color: #4ade80; }
  .card .t1, .card .t2 { height: 13px; border-radius: 7px; background: rgba(255,255,255,.16); margin-top: 12px; }
  .card .t2 { width: 64%; background: rgba(255,255,255,.1); }
  .bar { display: flex; gap: 3px; margin-top: 20px; }
  .bar span { flex: 1; text-align: center; font-size: 15px; font-weight: 700; padding: 6px 0 4px; color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); border-bottom: 3px solid var(--c); }
  .bar span:first-child { border-radius: 7px 0 0 7px; } .bar span:last-child { border-radius: 0 7px 7px 0; }
  .ok { --c: #4ade80; } .chk { --c: #60a5fa; } .part { --c: #fbbf24; }
  .why { margin-top: 16px; padding: 10px 12px; border-radius: 10px; background: rgba(45,212,191,.1); }
  .why small { display: block; font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: .1em; color: #5eead4; }
  .why div { height: 10px; border-radius: 5px; background: rgba(255,255,255,.18); margin-top: 8px; }
  .why div + div { width: 72%; }

  .foot { position: absolute; left: 80px; right: 80px; bottom: 58px; display: flex; justify-content: space-between; align-items: center; }
  .brand { display: flex; align-items: center; gap: 22px; font-size: 40px; font-weight: 800; letter-spacing: -0.02em; }
  .brand img { height: 26px; filter: brightness(0) invert(1); }
  .tagline { font-size: 22px; font-weight: 600; color: #8b97a8; }
</style>
</head>
<body>
<div class="og">
  <div class="grid"></div>
  <div class="radar">
    <i style="inset:0"></i><i style="inset:70px"></i><i style="inset:140px"></i><i style="inset:210px"></i>
  </div>
  <div class="eyebrow"><b></b>DAILY BIZ RADAR</div>
  <h1>AI·SW 공고를,<br><em>매일 아침 한눈에</em></h1>
  <div class="sub">국가R&amp;D · 지원사업 · 조선해양 IT — 규모 · 마감 · 적합도까지</div>

  <div class="card">
    <div class="top"><span class="type">● 국가R&amp;D</span><span class="dday">D-10</span></div>
    <div class="t1"></div><div class="t2"></div>
    <div class="bar"><span class="ok">✓ 분야</span><span class="chk">? 주관</span><span class="ok">✓ 지역</span><span class="part">△ 부담</span></div>
    <div class="why"><small>WHY IT MATTERS · 기회</small><div></div><div></div></div>
  </div>

  <div class="foot">
    <div class="brand"><img src="../assets/images/lspace_logo.png" alt="L.SPACE">Biz Radar</div>
    <div class="tagline">평일 매일 업데이트 · 공고 레이더</div>
  </div>
</div>
</body>
</html>
